# Project Configuration

data:
  raw_path: "data/raw/telco_customer_churn.csv"
  train_path: "data/processed/train.csv"
  test_path: "data/processed/test.csv"
  target_column: "Churn"
  id_column: "customerID"

split:
  test_size: 0.2
  stratify: true
  random_state: 42

features:
  numerical:
    - "tenure"
    - "MonthlyCharges"
    - "TotalCharges"
  categorical:
    - "gender"
    - "SeniorCitizen"
    - "Partner"
    - "Dependents"
    - "PhoneService"
    - "MultipleLines"
    - "InternetService"
    - "OnlineSecurity"
    - "OnlineBackup"
    - "DeviceProtection"
    - "TechSupport"
    - "StreamingTV"
    - "StreamingMovies"
    - "Contract"
    - "PaperlessBilling"
    - "PaymentMethod"

model:
  output_path: "models/churn_model.joblib"
  metrics_path: "reports/metrics.json"
  random_state: 42
  n_estimators: 150
  max_depth: 8
  min_samples_leaf: 4

visualization:
  figures_dir: "reports/figures"
